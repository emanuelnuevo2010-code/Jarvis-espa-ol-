name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Abrir TODOS los .zip del repo
        run: |
          find . -maxdepth 3 -name "*.zip" -not -path "./.git/*" -not -path "./_from_zip/*" | while read -r z; do
            echo "Abriendo $z"
            d="_from_zip/$(basename "$z" .zip)_$(date +%s%N)"
            mkdir -p "$d" && unzip -o -q "$z" -d "$d"
          done || true

      - name: Buscar el proyecto (el de versión más nueva)
        id: find
        run: |
          best=""; bestv=-1
          for f in $(find . -name settings.gradle.kts -not -path "*/node_modules/*"); do
            d=$(dirname "$f")
            v=$(grep -oE 'versionCode *= *[0-9]+' "$d/app/build.gradle.kts" 2>/dev/null | grep -oE '[0-9]+' | head -1 || true)
            echo "Encontrado: $d (versionCode ${v:-?})"
            if [ -n "${v:-}" ] && [ "$v" -gt "$bestv" ]; then bestv=$v; best=$d; fi
          done
          if [ -z "$best" ]; then
            echo "::error::No encuentro el proyecto. Archivos del repo:"
            ls -R | head -50
            exit 1
          fi
          echo "Usando: $best (versionCode $bestv)"
          echo "dir=$best" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Descargar motor de voz sherpa-onnx
        working-directory: ${{ steps.find.outputs.dir }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          REPO="k2-fsa/sherpa-onnx"
          mkdir -p app/libs
          tags=$(gh release list --repo "$REPO" --limit 40 --json tagName -q '.[].tagName')
          for tag in $tags; do
            name=$(gh release view "$tag" --repo "$REPO" --json assets -q '.assets[].name' 2>/dev/null | grep -E '\.aar$' | head -1 || true)
            if [ -n "$name" ]; then
              echo "Usando AAR $name de $tag"
              gh release download "$tag" --repo "$REPO" -p "$name" -O app/libs/sherpa-onnx.aar --clobber && exit 0
            fi
          done
          for tag in $tags; do
            name=$(gh release view "$tag" --repo "$REPO" --json assets -q '.assets[].name' 2>/dev/null | grep -E '^sherpa-onnx-v[0-9.]+-android\.tar\.bz2$' | head -1 || true)
            if [ -n "$name" ]; then
              echo "Usando paquete $name de $tag"
              gh release download "$tag" --repo "$REPO" -p "$name" -O sherpa-android.tar.bz2 --clobber || continue
              mkdir -p sherpa-tmp && tar xjf sherpa-android.tar.bz2 -C sherpa-tmp
              jni=$(find sherpa-tmp -type d -name jniLibs | head -1)
              [ -z "$jni" ] && continue
              mkdir -p app/src/main/jniLibs && cp -r "$jni"/* app/src/main/jniLibs/
              mkdir -p app/src/main/java/com/k2fsa/sherpa/onnx
              curl -fL -o app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt \
                "https://raw.githubusercontent.com/$REPO/$tag/sherpa-onnx/kotlin-api/Tts.kt" || continue
              echo "Listo: jniLibs + Tts.kt de $tag"
              exit 0
            fi
          done
          echo "::error::No pude conseguir sherpa-onnx"
          exit 1

      - name: Compilar APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
